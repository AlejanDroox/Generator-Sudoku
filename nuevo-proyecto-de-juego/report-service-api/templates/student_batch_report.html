<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reportes Académicos en Lote - Sudoku Samurai++</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    
    :root {
      --primary: #4F46E5;
      --primary-light: #EEF2F6;
      --secondary: #06B6D4;
      --dark: #0F172A;
      --light-bg: #F8FAFC;
      --border: #E2E8F0;
      --text: #334155;
      --text-muted: #64748B;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif;
      color: var(--text);
      background-color: #FFFFFF;
      margin: 0;
      padding: 0;
      line-height: 1.5;
      -webkit-print-color-adjust: exact;
    }

    .student-report-page {
      page-break-after: always;
      box-sizing: border-box;
      padding: 40px;
      position: relative;
    }

    .student-report-page:last-child {
      page-break-after: avoid;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--primary-light);
      padding-bottom: 20px;
      margin-bottom: 25px;
    }

    .brand h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      margin: 0;
      letter-spacing: -0.5px;
    }

    .brand span {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-top: 4px;
      display: block;
    }

    .report-meta {
      text-align: right;
    }

    .report-meta h2 {
      font-size: 18px;
      font-weight: 600;
      color: var(--dark);
      margin: 0;
    }

    .report-meta p {
      font-size: 12px;
      color: var(--text-muted);
      margin: 4px 0 0 0;
    }

    .student-info-card {
      background-color: var(--light-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 16px;
      margin-bottom: 25px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .info-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--dark);
      margin-top: 4px;
    }

    .grid-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 25px;
    }

    .stat-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      background-color: #FFFFFF;
    }

    .stat-card.primary { border-top: 4px solid var(--primary); }
    .stat-card.secondary { border-top: 4px solid var(--secondary); }
    .stat-card.success { border-top: 4px solid var(--success); }
    .stat-card.warning { border-top: 4px solid var(--warning); }

    .stat-num {
      font-size: 22px;
      font-weight: 700;
      color: var(--dark);
      margin-top: 4px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .charts-container {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 16px;
      margin-bottom: 25px;
    }

    .chart-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      background-color: #FFFFFF;
    }

    .chart-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--dark);
      margin-top: 0;
      margin-bottom: 12px;
      border-left: 3px solid var(--primary);
      padding-left: 8px;
    }

    .chart-wrapper {
      position: relative;
      height: 180px;
      width: 100%;
    }

    .table-container {
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--dark);
      margin-top: 0;
      margin-bottom: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: var(--light-bg);
      border-bottom: 2px solid var(--border);
      padding: 8px 10px;
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    td {
      border-bottom: 1px solid var(--border);
      padding: 9px 10px;
      font-size: 12px;
      color: var(--text);
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 600;
      text-transform: capitalize;
    }

    .badge.facil { background-color: #D1FAE5; color: #065F46; }
    .badge.medio { background-color: #FEF3C7; color: #92400E; }
    .badge.dificil { background-color: #FEE2E2; color: #991B1B; }
    .badge.extremo { background-color: #F3E8FF; color: #6B21A8; }

    .footer {
      position: absolute;
      bottom: 40px;
      left: 40px;
      right: 40px;
      border-top: 1px solid var(--border);
      padding-top: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div id="reports-container">
    <!-- Se inyecta dinámicamente un bloque .student-report-page por estudiante -->
  </div>

  <script>
    function initReport(data) {
      const container = document.getElementById('reports-container');
      container.innerHTML = '';

      if (!data.students || data.students.length === 0) {
        container.innerHTML = '<div style="padding: 40px; text-align: center;">No hay alumnos para generar reportes en este lote.</div>';
        return;
      }

      data.students.forEach((student, index) => {
        const studentId = student.id;
        const page = document.createElement('div');
        page.className = 'student-report-page';
        
        const dateStr = new Date(data.generatedAt || Date.now()).toLocaleDateString('es-ES', {
          year: 'numeric', month: 'long', day: 'numeric'
        });
        
        const avgSeconds = student.stats.avgTimeSeconds || 0;
        const mins = Math.floor(avgSeconds / 60);
        const secs = Math.round(avgSeconds % 60);
        
        // Tabla de juegos recientes
        let tableRowsHTML = '';
        if (!student.games || student.games.length === 0) {
          tableRowsHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">No hay partidas registradas.</td></tr>';
        } else {
          student.games.forEach(g => {
            const gDate = new Date(g.fecha || g.created_at).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: '2-digit' });
            const gMins = Math.floor(g.tiempo / 60);
            const gSecs = Math.round(g.tiempo % 60);
            
            let modoStr = g.modo === 'practice' ? 'Práctica' : (g.modo === 'challenge' ? 'Desafío' : g.modo);
            
            const varMap = {
              'anti_knight': 'Anti-Caballo',
              'thermo': 'Termo',
              'killer': 'Jaulas Killer',
              'arrow': 'Flecha'
            };
            let vars = 'Ninguna';
            if (Array.isArray(g.variantes_activas) && g.variantes_activas.length > 0) {
              vars = g.variantes_activas.map(v => varMap[v] || v).join(', ');
            } else if (typeof g.variantes === 'string') {
              vars = g.variantes;
            }

            const scoreVal = g.puntuacion !== undefined ? g.puntuacion : (g.score || 0);
            const tablerosVal = g.tableros_completados !== undefined ? g.tableros_completados : 1;

            tableRowsHTML += `
              <tr>
                <td>${gDate}</td>
                <td><span class="badge ${g.dificultad.toLowerCase()}">${g.dificultad}</span></td>
                <td>${modoStr}</td>
                <td>${vars}</td>
                <td>${tablerosVal}</td>
                <td style="font-weight: 600; color: var(--primary);">${scoreVal.toLocaleString()}</td>
                <td>${gMins}m ${gSecs}s</td>
              </tr>
            `;
          });
        }

        page.innerHTML = `
          <div class="header">
            <div class="brand">
              <h1>SUDOKU SAMURAI++</h1>
              <span>Reporte Académico de Rendimiento</span>
            </div>
            <div class="report-meta">
              <h2>Estadísticas del Estudiante</h2>
              <p>Generado: <span>${dateStr}</span></p>
            </div>
          </div>

          <div class="student-info-card">
            <div class="info-item">
              <span class="info-label">Estudiante</span>
              <span class="info-value">${student.student.nombre}</span>
            </div>
            <div class="info-item">
              <span class="info-label">Usuario</span>
              <span class="info-value">${student.student.usuario}</span>
            </div>
            <div class="info-item">
              <span class="info-label">Grupo Escolar</span>
              <span class="info-value">${student.student.grupo}</span>
            </div>
          </div>

          <div class="grid-stats">
            <div class="stat-card primary">
              <span class="stat-label">Puntuación Total</span>
              <div class="stat-num">${student.stats.totalScore.toLocaleString()}</div>
            </div>
            <div class="stat-card secondary">
              <span class="stat-label">Partidas Jugadas</span>
              <div class="stat-num">${student.stats.gamesPlayed}</div>
            </div>
            <div class="stat-card success">
              <span class="stat-label">Tiempo Promedio</span>
              <div class="stat-num">${mins}m ${secs}s</div>
            </div>
            <div class="stat-card warning">
              <span class="stat-label">Errores Promedio</span>
              <div class="stat-num">${(student.stats.avgErrors || 0.0).toFixed(1)}</div>
            </div>
          </div>

          <div class="charts-container">
            <div class="chart-box">
              <h3 class="chart-title">Evolución de Puntaje (Últimas Partidas)</h3>
              <div class="chart-wrapper">
                <canvas id="scoreChart_${studentId}"></canvas>
              </div>
            </div>
            <div class="chart-box">
              <h3 class="chart-title">Partidas por Dificultad</h3>
              <div class="chart-wrapper">
                <canvas id="difficultyChart_${studentId}"></canvas>
              </div>
            </div>
          </div>

          <div class="table-container">
            <h3 class="section-title">Mejor Partida en Leaderboard</h3>
            <table>
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Dificultad</th>
                  <th>Modo</th>
                  <th>Variantes</th>
                  <th>Tableros</th>
                  <th>Puntaje</th>
                  <th>Tiempo</th>
                </tr>
              </thead>
              <tbody>
                ${tableRowsHTML}
              </tbody>
            </table>
          </div>

          <div class="footer">
            <span>© 2026 Sudoku Samurai++</span>
            <span>Estudiante ${index + 1} de ${data.students.length}</span>
          </div>
        `;

        container.appendChild(page);

        // Renderizar gráficos de este estudiante
        const scoreCtx = document.getElementById(`scoreChart_${studentId}`).getContext('2d');
        const scoreLabels = student.chartData.scores.map((_, i) => `Partida ${i + 1}`);
        new Chart(scoreCtx, {
          type: 'line',
          data: {
            labels: scoreLabels,
            datasets: [{
              label: 'Puntaje',
              data: student.chartData.scores,
              borderColor: '#4F46E5',
              backgroundColor: 'rgba(79, 70, 229, 0.05)',
              borderWidth: 2.5,
              fill: true,
              tension: 0.3,
              pointBackgroundColor: '#4F46E5',
              pointRadius: 3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { grid: { color: '#F1F5F9' }, ticks: { font: { size: 9 } } },
              x: { grid: { display: false }, ticks: { font: { size: 9 } } }
            }
          }
        });

        // Gráfico de dona
        const diffCtx = document.getElementById(`difficultyChart_${studentId}`).getContext('2d');
        const diffLabels = Object.keys(student.chartData.difficulties);
        const diffValues = Object.values(student.chartData.difficulties);
        const diffColors = {
          'Facil': '#10B981', 'Medio': '#F59E0B', 'Dificil': '#EF4444', 'Extremo': '#8B5CF6'
        };
        const backgroundColors = diffLabels.map(label => diffColors[label] || '#64748B');

        new Chart(diffCtx, {
          type: 'doughnut',
          data: {
            labels: diffLabels,
            datasets: [{
              data: diffValues,
              backgroundColor: backgroundColors,
              borderWidth: 2,
              borderColor: '#ffffff'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'right',
                labels: { font: { size: 9 }, boxWidth: 10 }
              }
            },
            cutout: '60%'
          }
        });
      });
    }
  </script>
</body>
</html>
